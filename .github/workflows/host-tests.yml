name: Host tests

on:
  push:
    paths: ['host/**', 'tools/**', '.github/workflows/host-tests.yml']
  pull_request:
    paths: ['host/**', 'tools/**', '.github/workflows/host-tests.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run checks
        run: ./tools/check.sh
